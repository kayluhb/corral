[project]
name = "corral"
version = "1.0.0"
description = "Keyboard-first status and navigation for Claude Code sessions in iTerm2"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
daemon = ["iterm2==2.30"]

[project.scripts]
corral = "corral.cli:main"
corral-hook = "corral.hook:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "iterm2==2.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corral"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:websockets.legacy is deprecated:DeprecationWarning"]  # from iterm2
