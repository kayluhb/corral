name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older runs, so they don't queue for a macOS runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10  # the suite takes seconds; a hang fails here, not after hours
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
